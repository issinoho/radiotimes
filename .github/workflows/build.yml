name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  bridge:
    name: bridge tests (pytest vs pinned tvdinner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 pytest
      - run: python -m pytest -q python-tests
        env:
          PYTHONPATH: app/src/main/python:vendor/tvdinner/src

  apk:
    name: debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy uses a host Python of the same minor version to pip-install
      # and byte-compile; it must match chaquopy.defaultConfig.version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: radiotimes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
